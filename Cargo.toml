[package]
name = "termrec"
version = "0.1.0"
edition = "2024"
description = "Record a terminal session and reconstruct a readable, command-aware Markdown transcript."
license = "MIT"

[dependencies]
alacritty_terminal = "0.26.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
minijinja = "2.23.0"
minijinja-embed = "2.23.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
xdg = "3.0.0"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
minijinja-embed = "2.23.0"
